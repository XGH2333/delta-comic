name: Build Debian 13 arm64

on:
  push:
    branches:
      - ci/arm64-deb
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 150
    env:
      DEBIAN_FRONTEND: noninteractive
      HUSKY: 0
      CI: 'true'
      DELTA_SKIP_LIB_BUILD: 'true'
      CARGO_TERM_COLOR: always
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git gh xz-utils file \
            build-essential cmake perl pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - uses: actions/checkout@v7

      - name: Install Node.js
        run: |
          curl -fsSL "https://nodejs.org/dist/v26.10.0/node-v26.10.0-linux-arm64.tar.xz" -o /tmp/node.tar.xz
          tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
          node --version
          npm --version

      - name: Install pnpm and Vite+
        run: |
          npm install -g pnpm@12.18.0 vite-plus@1.5.0
          vp --version

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain nightly-2026-08-12 --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install workspace dependencies
        run: vp install --frozen-lockfile

      - name: Build workspace packages
        run: vp run build:packages

      - name: Build Debian package
        run: |
          cd packages/app/desktop
          vp exec tauri build --bundles deb

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find . -path '*/bundle/deb/*.deb' -exec cp -v {} dist/ \;
          ls -l dist
          for f in dist/*.deb; do
            dpkg-deb -I "$f"
            sha256sum "$f"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: delta-comic-debian13-arm64
          path: dist/*.deb
          if-no-files-found: error

      - name: Publish preview release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "arm64-deb-${{ github.run_number }}" dist/*.deb \
            --title "Debian 13 arm64 build ${{ github.run_number }}" \
            --prerelease \
            --notes "Automated Debian 13 (trixie) arm64 build from ${{ github.sha }}."
