name: Build Debian 13 arm64

on:
  push:
    branches:
      - ci/arm64-deb
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      HUSKY: 0
      CI: 'true'
      DELTA_SKIP_LIB_BUILD: 'true'
      CARGO_TERM_COLOR: always
    steps:
      - name: Install system packages
        run: |
          cat > /usr/local/bin/run-step <<'EOS'
          #!/bin/bash
          name="$1"; shift
          set +e
          "$@" > /tmp/step.log 2>&1
          rc=$?
          tail -n 60 /tmp/step.log
          if [ "$rc" -ne 0 ]; then
            msg=$(tail -c 2400 /tmp/step.log | tr '\n' ' ' | tr -d '\r')
            i=0
            while [ -n "$msg" ] && [ "$i" -lt 3 ]; do
              echo "::error::${name} rc=${rc} :: ${msg:0:800}"
              msg=${msg:800}
              i=$((i+1))
            done
            exit "$rc"
          fi
          echo "::notice::${name} ok"
          EOS
          chmod +x /usr/local/bin/run-step
          run-step "apt install" bash -c 'apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git gh xz-utils file build-essential cmake perl pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf'

      - uses: actions/checkout@v7

      - name: Checkout probe
        run: echo "::notice::checkout ok"

      - name: Install Node.js
        run: |
          run-step "node install" bash -c 'curl -fsSL "https://nodejs.org/dist/v26.10.0/node-v26.10.0-linux-arm64.tar.xz" -o /tmp/node.tar.xz && tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1 && node --version && npm --version'

      - name: Install pnpm and Vite+
        run: |
          run-step "pnpm/vp install" bash -c 'npm install -g pnpm@12.18.0 vite-plus@1.5.0 && command -v vp && (vp --version || true)'

      - name: Install Rust toolchain
        run: |
          run-step "rustup install" bash -c 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh && sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain nightly-2026-08-12 --no-modify-path'
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install workspace dependencies
        run: |
          run-step "vp install" vp install --frozen-lockfile
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Resolve Vite+ binary
        run: |
          command -v vp
          echo "::notice::vp resolved to $(command -v vp)"

      - name: Build workspace packages
        run: run-step "vp run build:packages" vp run build:packages

      - name: Build Debian package
        run: run-step "tauri build" bash -c 'cd packages/app/desktop && vp exec tauri build --bundles deb'

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find . -path '*/bundle/deb/*.deb' -exec cp -v {} dist/ \;
          ls -l dist
          for f in dist/*.deb; do
            dpkg-deb -I "$f"
            sha256sum "$f"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: delta-comic-debian13-arm64
          path: dist/*.deb
          if-no-files-found: error

      - name: Publish preview release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "arm64-deb-${{ github.run_number }}" dist/*.deb \
            --title "Debian 13 arm64 build ${{ github.run_number }}" \
            --prerelease \
            --notes "Automated Debian 13 (trixie) arm64 build from ${{ github.sha }}."
