name: Android CI

on:
  push:
    branches:
      - ci/android-release-test
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci/${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      HUSKY: 0
      CI: 'true'
      DELTA_SKIP_LIB_BUILD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          node-manager: true
          run-install: true
          version-file: package.json

      - name: Build workspace packages
        run: vp run build:packages

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-12
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1.5.0
        with:
          ndk-version: r29
          link-to-sdk: true
          local-cache: true
          add-to-path: true

      - name: Initialize Android project
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          cd packages/app/mobile
          vp run --filter @delta-comic/client-mobile --fail-if-no-match tauri android init --ci --skip-targets-install
          git restore src-tauri/gen/android/buildSrc/src/main/java/org/wenxig/delta_comic/kotlin/BuildTask.kt

      - name: Make Gradle wrapper executable
        run: chmod +x ./packages/app/mobile/src-tauri/gen/android/gradlew

      - name: Build Android App
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd packages/app/mobile
          vp run --filter @delta-comic/client-mobile --fail-if-no-match tauri android build --ci --target aarch64

      - name: Sign APK
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.keystore" -alias ci -keyalg RSA \
            -keysize 2048 -validity 3650 -storepass cipass -keypass cipass -dname "CN=CI"
          mkdir -p dist
          unsigned=$(find packages/app/mobile/src-tauri/gen/android/app/build/outputs/apk \
            -name '*-release-unsigned.apk' | head -n1)
          echo "unsigned apk: $unsigned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/ci.keystore" --ks-pass pass:cipass --key-pass pass:cipass \
            --out "dist/delta-comic-ci-${{ github.run_number }}-android.apk" "$unsigned"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            "dist/delta-comic-ci-${{ github.run_number }}-android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-ci-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "android-ci-${{ github.run_number }}" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Android CI build ${{ github.run_number }}" \
            --prerelease \
            --notes "Automated Android release build from ${{ github.sha }} (utils Android plugin registration fix)."
