    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src * chrome-extension: blob: tauri: local: asset: plugin: ipc: ws: wss: 'unsafe-inline' 'unsafe-eval' data: chrome-extension: blob: tauri:; script-src * chrome-extension: blob: tauri: local: asset: plugin: ipc: ws: wss: 'unsafe-inline' 'unsafe-eval'; connect-src * chrome-extension: blob: tauri: local: asset: plugin: ipc: ws: wss: 'unsafe-inline'; img-src * chrome-extension: blob: tauri: local: asset: plugin: ipc: ws: wss: data: chrome-extension: blob: tauri:; frame-src * chrome-extension: blob: tauri: local: asset: plugin: ipc: ws: wss:; style-src * chrome-extension: blob: tauri: local: asset: plugin: ipc: ws: wss: 'unsafe-inline'; worker-src * blob: plugin:;"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover"
    />
    <script>
      ;(function () {
        var show = function (msg) {
          var el = document.getElementById('__boot_error')
          if (!el) {
            el = document.createElement('pre')
            el.id = '__boot_error'
            el.style.cssText =
              'position:fixed;left:0;top:0;right:0;z-index:2147483647;background:#fff;color:#c00;font:14px/1.4 monospace;white-space:pre-wrap;padding:12px;margin:0;max-height:70vh;overflow:auto'
            document.documentElement.appendChild(el)
          }
          el.textContent += msg + '\n'
        }
        window.addEventListener(
          'error',
          function (e) {
            if (e.target && (e.target.src || e.target.href)) show('RESOURCE FAIL: ' + (e.target.src || e.target.href))
            else show('ERROR: ' + (e.message || e.type) + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''))
          },
          true,
        )
        window.addEventListener('unhandledrejection', function (e) {
          show('REJECTION: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason))
        })
        setTimeout(function () {
          var app = document.getElementById('app')
          show(
            'BOOT CHECK 6s: appChildren=' +
              (app ? app.childElementCount : 'no-app') +
              '; scripts=' +
              [].map
                .call(document.scripts, function (s) {
                  return s.src || 'inline'
                })
                .join(' | '),
          )
        }, 6000)
      })()
    </script>
    <link rel="shortcut icon" href="/favicon.png" type="image/x-icon" />
    <link rel="apple-touch-icon" href="/favicon.png" type="image/x-icon" />
  </head>

  <body class="static size-full">
    <div id="popups"></div>
    <div id="app" class="static size-full overflow-auto bg-dc-page **:select-none"></div>

    <script>
      window.process = { env: {} }

      window.$api = {}
      window.$layout = {}
      window.$$lib$$ ??= {}
    </script>
    <script src="/runtime/host-libraries.umd.js"></script>
    <script type="module" src="./src/entries/main.ts"></script>
  </body>
</html>
